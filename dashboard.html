<!doctype html>
<html lang="vi">
<head>

  <meta name="robots" content="noindex">
  <title>Tổng quan | Đầu tư cùng Vũ</title>
  <link rel="canonical" href="dashboard/">
  <script>
    // Chuyển URL cũ dashboard.html sang dashboard/ (giữ nguyên ?query và #hash)

</head>
<body>
  <p>Trang đã chuyển tới <a href="dashboard/">dashboard/</a>.</p>
